name: Generate Sky TG24 EPG

# Rebuilds skytg24.xml from guidatv.org on a schedule and commits it when it changes.
on:
  schedule:
    - cron: "5 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch: {}       # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: ["generate.py", ".github/workflows/epg.yml"]

permissions:
  contents: write             # allow the job to commit skytg24.xml back to the repo

concurrency:
  group: epg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every four hours rather than six, and the script merges into the committed file instead of
      # replacing it. The source drops a programme from today's page the moment it has finished,
      # so the only record of this morning is the run that saw it — and this is the channel the
      # DVR records round the clock, where a recording is named from the guide covering it.
      - name: Generate skytg24.xml
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain skytg24.xml)" ]; then
            git add skytg24.xml
            git commit -m "Update Sky TG24 EPG ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "skytg24.xml unchanged — nothing to commit."
          fi
